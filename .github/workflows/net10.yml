name: net10
# Stage 4 of docs/MIGRATION.md: the node on .NET 10. F* (fstar.exe) still runs on Mono as an external tool.
on:
  push:
    branches: [net10]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Native and Mono dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-devel liblmdb-dev libgomp1

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/ContractTool/ContractTool.fsproj 2>&1 | tee /tmp/restore.log && dotnet restore src/Node/Node.fsproj 2>&1 | tee -a /tmp/restore.log || { echo "::error title=restore::$(grep -E "error" /tmp/restore.log | sort -u | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Build node
        shell: bash
        run: |
          set -o pipefail
          { dotnet build src/ContractTool/ContractTool.fsproj -c Debug -v minimal --no-restore && dotnet build src/Node/Node.fsproj -c Debug -v minimal --no-restore; } 2>&1 | tee /tmp/build.log || { grep -E " error " /tmp/build.log | sed -E 's#/home/runner/work/zenprotocol/zenprotocol/##g; s# \[[^]]*\]$##' | sort -u | head -80 > /tmp/err.txt; split -l 12 /tmp/err.txt /tmp/errpart.; for f in /tmp/errpart.*; do echo "::error title=build::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; exit 1; }

      - name: Node starts on .NET 10 and answers the API (sync is checked in the docker job)
        shell: bash
        run: |
          cd src/Node/bin/Debug
          timeout 120 dotnet zen-node.dll --data-path /tmp/zen-smoke --api 127.0.0.1:11567 > /tmp/node.log 2>&1 &
          for i in $(seq 1 24); do sleep 5; INFO=$(curl -s http://127.0.0.1:11567/blockchain/info || true); [ -n "$INFO" ] && break; done
          echo "::notice title=node info::$INFO"
          grep -E "check passed" /tmp/node.log | sed 's/^/::notice title=node::/'
          echo "$INFO" | grep -q '"chain":"main"'

      - name: Contract tool runs on Mono
        shell: bash
        run: |
          cd src/Node/bin/Debug
          H=$(ls compatibility/v0_contract_hints/*.hints | head -1)
          Q=$(mono contract-tool/zen-contract-tool.exe total-queries "$H")
          echo "::notice title=contract tool::total queries of $(basename $H): $Q"
          [[ "$Q" =~ ^[0-9]+$ ]]

      - name: Build tests
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/build.log
          for p in Infrastructure.Tests Zulib.Tests Consensus.Tests Blockchain.Tests Wallet.Tests AddressDB.Tests Network.Tests Api.Tests; do
            dotnet build src/$p/$p.fsproj -c Debug -v minimal 2>&1 | tee -a /tmp/build.log || true
          done
          grep -E "error (FS|NU|MSB|CS)[0-9]+" /tmp/build.log | sed -E 's#/home/runner/work/zenprotocol/zenprotocol/##g; s# \[[^]]*\]$##' | sort -u | head -80 > /tmp/err.txt || true
          wc -l /tmp/err.txt
          if [ -s /tmp/err.txt ]; then split -l 12 /tmp/err.txt /tmp/errpart.; for f in /tmp/errpart.*; do echo "::error title=test build::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; exit 1; fi

      - name: Run tests
        shell: bash
        run: |
          fail=0
          for p in Zulib.Tests Infrastructure.Tests Consensus.Tests Blockchain.Tests Wallet.Tests AddressDB.Tests Network.Tests; do
            dotnet test src/$p/$p.fsproj -c Debug --no-build -v q --logger "console;verbosity=minimal" > /tmp/t-$p.log 2>&1 || fail=1
            echo "::notice title=$p::$(grep -E "Passed!|Failed!" /tmp/t-$p.log | head -3 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            grep -q "Failed!" /tmp/t-$p.log && echo "::notice title=$p failures (gz64)::$(grep -E -A12 "^\s+Failed " /tmp/t-$p.log | head -400 | gzip -c | base64 -w0)"
          done
          exit $fail

      - name: Upload node build
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: zen-node-net10, path: src/Node/bin/Debug/, if-no-files-found: ignore }

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        shell: bash
        run: |
          docker build --progress=plain -f Docker/Dockerfile.net10 -t zen-node:net10 . > /tmp/b.log 2>&1 || { echo "::error title=image build::$(grep -vE '^#[0-9]+ (sha256|extracting|DONE|CACHED)' /tmp/b.log | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          docker images zen-node:net10 --format '{{.Size}}' | sed 's/^/::notice title=image size::/'
      - name: Smoke test - image joins mainnet
        shell: bash
        run: |
          docker run -d --name zn zen-node:net10
          sleep 180
          INFO=$(docker exec zn curl -s http://127.0.0.1:11567/blockchain/info || true)
          echo "::notice title=image node::$INFO"
          echo "::notice title=image log::$(docker logs zn 2>&1 | grep -E 'check passed|ERR|Exception' | head -15 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "$INFO" | grep -qE '"blocks":[1-9]'
