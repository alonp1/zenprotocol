name: image
# Ready-made node image, so installing a node needs no build (and no MyGet): ghcr.io/<owner>/zen-node
on:
  workflow_dispatch:
  push:
    branches: [node-upgrade-script]
    paths: [Docker/**, src/Node/main.yaml, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Lower-case owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/zen-node:latest
            ghcr.io/${{ env.OWNER }}/zen-node:1.0.13
      - name: Smoke test
        run: |
          docker run -d --name zn -e NETWORK_URL=off ghcr.io/${OWNER}/zen-node:latest
          for i in $(seq 1 40); do docker exec zn curl -fs http://127.0.0.1:11567/blockchain/info >/dev/null 2>&1 && break; sleep 4; done
          INFO=$(docker exec zn curl -fs http://127.0.0.1:11567/blockchain/info | head -c 300 || echo "API did not answer")
          echo "::notice title=info::$INFO"
          docker logs --tail 20 zn 2>&1 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=log::/'
