name: build

on:
  push:
    branches-ignore: [net10]   # the .NET 10 port has its own workflow (net10.yml)
  pull_request:
  workflow_dispatch:

jobs:
  miner:
    # GPU miner kernel vs Python hashlib, on the CPU OpenCL driver (pocl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyopencl numpy pocl-binary-distribution
      - run: python miner/zpminer.py list && python miner/zpminer.py selftest && python miner/zpminer.py bench --seconds 5
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd wallet && npm ci && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: zp-wallet-web, path: wallet/dist }
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build node image
        run: |
          docker build -f Docker/Dockerfile -t zen-node:ci .
          docker run --rm --entrypoint grep zen-node:ci -A3 "^seeds" /zen/main.yaml
      - name: Smoke test - node starts and syncs
        run: |
          docker run -d --name zn zen-node:ci
          sleep 120
          docker logs zn > /tmp/zn.log 2>&1 || true
          INFO=$(docker exec zn curl -s -w ' HTTP%{http_code}' http://127.0.0.1:11567/blockchain/info || true)
          echo "::notice title=api::$INFO"
          tail -40 /tmp/zn.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=node log::/'
          echo "$INFO" | grep -q HTTP200
      - name: Smoke test - wallet create (test mnemonic, throwaway)
        run: |
          W='"abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","abandon","art"'
          IMP=$(docker exec zn curl -s -w ' HTTP%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"password\":\"ci-test\",\"words\":[$W]}" http://127.0.0.1:11567/wallet/import)
          ADDR=$(docker exec zn curl -s -w ' HTTP%{http_code}' http://127.0.0.1:11567/wallet/address)
          echo "::notice title=wallet import::$IMP"
          echo "::notice title=wallet address::$ADDR"
          docker logs zn 2>&1 | grep -iA8 "derive" | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=derive log::/' || true
          echo "$ADDR" | grep -q HTTP200

  source-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build node image from source
        run: |
          set -o pipefail
          docker build --progress=plain -f Docker/Dockerfile.source -t zen-node:source . > /tmp/b.log 2>&1 || { grep -vE '^#[0-9]+ (sha256|extracting|DONE|CACHED)' /tmp/b.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=source build::/'; exit 1; }
      - name: Smoke test - source image joins mainnet
        run: |
          docker run -d --name zs zen-node:source
          sleep 150
          INFO=$(docker exec zs curl -s http://127.0.0.1:11567/blockchain/info || true)
          echo "::notice title=source image::$INFO"
          docker logs zs 2>&1 | tail -15 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=source image log::/'
          echo "$INFO" | grep -qE '"blocks":[1-9]'

  build:
    runs-on: ubuntu-latest
    container: mono:6.12
    timeout-minutes: 90
    steps:
      - name: Point Debian buster apt to the archive (buster is EOL)
        run: |
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g; s|deb.debian.org/debian|archive.debian.org/debian|g; s|security.debian.org|archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -y
          apt-get install -y -qq git fsharp libgomp1 libstdc++6 liblmdb0 ca-certificates curl
          # Mono keeps its own cert store; refresh it with a current Mozilla bundle
          curl -fsSL https://curl.se/ca/cacert.pem -o /tmp/cacert.pem
          cert-sync /tmp/cacert.pem

      - uses: actions/checkout@v4

      - name: Restore packages (paket)
        shell: bash
        run: |
          set -o pipefail
          mono .paket/paket.exe restore 2>&1 | tee /tmp/paket.log || { tail -40 /tmp/paket.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=paket::/'; exit 1; }

      - name: Install .NET SDK
        shell: bash
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
          echo "/usr/share/dotnet" >> $GITHUB_PATH
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          chmod +x packages/zen_z3_linux/output/z3-linux
          chmod +x packages/SpecFlow/tools/specflow.exe || true
          dotnet --version
          set -o pipefail
          dotnet build src/zenprotocol.sln -c Debug -v minimal -nologo 2>&1 | tee /tmp/build.log || { grep -E "error" /tmp/build.log | sort -u | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=build::/'; exit 1; }

      - name: Test
        shell: bash
        run: |
          cp packages/zen_secp256k1_linux/output/libsecp256k1.so /usr/lib
          set -o pipefail
          ./run-tests 2>&1 | tee /tmp/test.log || { tail -60 /tmp/test.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=tests::/'; exit 1; }

      - name: Smoke test - self-built node joins mainnet
        shell: bash
        run: |
          cd src/Node/bin/Debug
          timeout 120 mono zen-node.exe --data-path /tmp/zen-smoke --api 127.0.0.1:11567 > /tmp/node.log 2>&1 || true
          tail -25 /tmp/node.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=self-built node::/'
          grep -qE '^\[[0-9]{2}:[0-9]{2}:[0-9]{2} INF\] ' /tmp/node.log
          grep -qE 'New block|BlockAdded|Validating new block' /tmp/node.log

      - name: Upload node binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-node-bin
          path: src/Node/bin/Debug/
          if-no-files-found: ignore
