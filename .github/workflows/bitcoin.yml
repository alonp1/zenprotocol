name: bitcoin
# BitZen step T1: one testnet node, activate src/ContractExamples/BitcoinHeader.fst and run scripts/testnet-bitcoin.sh.
on:
  workflow_dispatch:
  push:
    branches: [node-upgrade-script]
    paths: ['src/ContractExamples/BitcoinHeader.fst', 'scripts/testnet-bitcoin.sh', '.github/workflows/bitcoin.yml']

permissions: { contents: read, packages: read }

jobs:
  bitcoin:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MN: abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Node image
        run: docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zen-node:net10 && docker tag ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zen-node:net10 zen-testnet
      - name: Start a mining testnet node
        run: |
          docker run -d --name zt-a -p 127.0.0.1:31567:31567 -e NETWORK=test -e NETWORK_URL=off -e SEEDS= -e MINER_THREADS=2 -e WALLET_API=1 -e TESTNET_MNEMONIC="$MN" zen-testnet
          tip() { curl -fs http://127.0.0.1:31567/blockchain/info | sed -n 's/.*"blocks": *\([0-9]*\).*/\1/p'; }
          for i in $(seq 120); do sleep 10; T=$(tip || true); echo "tip: $T"; [ -n "$T" ] && [ "$T" -ge 14 ] && break; done
          [ -n "$T" ] && [ "$T" -ge 14 ]
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build the oracle tool (its body command builds message bodies)
        run: |
          dotnet restore src/Oracle/Oracle.fsproj -v q >/dev/null 2>&1
          dotnet build src/Oracle/Oracle.fsproj -c Release --no-restore -v q 2>&1 | tail -n 3
      - name: BitcoinHeader on the testnet
        run: |
          set +e
          bash scripts/testnet-bitcoin.sh http://127.0.0.1:31567 testnet > /tmp/bitcoin.txt 2>&1
          RC=$?
          cat /tmp/bitcoin.txt | tail -n 60
          head -c 7000 /tmp/bitcoin.txt | python3 -c "import sys;print('::notice title=bitcoin output::'+'%0A'.join(l.rstrip().replace('%','%25') for l in sys.stdin))"
          exit $RC
      - name: Node log
        if: always()
        run: docker logs zt-a 2>&1 | grep -i -E "contract|error|fail|fstar|verif" | tail -n 40
