name: snapshot-test

on:
  workflow_dispatch:
  push:
    paths:
      - Docker/load-snapshot.sh
      - .github/workflows/snapshot-test.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Load snapshot
        run: |
          RC=0
          docker compose run --rm --no-deps --entrypoint /load-snapshot.sh zen-node > /tmp/load.log 2>&1 || RC=$?
          tail -40 /tmp/load.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=load::/'
          exit $RC
      - name: Start node from snapshot
        run: |
          docker compose up -d
          sleep 150
          INFO=$(curl -s http://127.0.0.1:11567/blockchain/info || true)
          echo "::notice title=info::$INFO"
          docker compose logs --tail 25 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::notice title=log::/'
          echo "$INFO" | grep -q '"blocks":[0-9]\{6,\}'
