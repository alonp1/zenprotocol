services:
  zen-node:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: zen-node
    restart: unless-stopped
    cpus: "${ZEN_CPUS:-1.0}"        # cap CPU so other services on the host stay responsive
    mem_limit: "${ZEN_MEM:-2g}"
    environment:
      MINER_THREADS: "${MINER_THREADS:-0}"   # e.g. MINER_THREADS=2
      EXTERNAL_IP: "${EXTERNAL_IP:-}"        # public IP, optional
      WALLET_API: "${WALLET_API:-0}"         # 1 = serve the desktop Zen Wallet on localhost
    ports:
      - "9655:9655"               # P2P - open to the world
      - "127.0.0.1:11567:11567"   # API - this machine only, never expose
    volumes:
      # chain + wallet. Default: ./zen-data folder. On Windows set ZEN_DATA=zen-data in .env
      # to use a Docker volume instead - a Windows folder is very slow for the database.
      - ${ZEN_DATA:-./zen-data}:/data

volumes:
  zen-data:
