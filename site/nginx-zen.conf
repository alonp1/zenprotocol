# Community node page (setup-site.sh replaces the server_name with DOMAIN + EXTRA_DOMAINS), read-only status API, snapshot downloads.
# Only two read-only node endpoints are exposed. Everything else on the node API
# (wallet, send, import...) stays private on 127.0.0.1:11567.
#
# /node/ - public node for light wallets (node started with PUBLIC_NODE=1).
# Whitelist of read-only chain/address endpoints plus publishtransaction (needed to send and vote).
# Mining, wallet and resync endpoints are never exposed.
limit_req_zone $binary_remote_addr zone=zennode:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name zen.sealinkgps.com;

    root /var/www/zen;
    index index.html;

    location = /api/info {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:11567/blockchain/info;
        proxy_set_header Host 127.0.0.1;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /api/peers {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:11567/network/connections/count;
        proxy_set_header Host 127.0.0.1;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location /api/ { return 404; }

    location ~ ^/node/(blockchain/(info|headers|cgp|mempool|block|blocks|transaction|publishtransaction|winner|totalzp|candidates|blockreward)|addressdb/(balance|outputs|transactions|transactioncount|discovery)|contract/active|address/decode)$ {
        limit_req zone=zennode burst=40 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:11567/$1$is_args$args;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    location /node/ { return 404; }

    # explorer API (site/explorer-api.mjs): read-only, local only, rate limited like /node/
    location /explorer/api/ {
        limit_req zone=zennode burst=40 nodelay;
        proxy_pass http://127.0.0.1:11580;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-cache";
    }

    # oracle service (src/Oracle, zen-oracle): public values and proofs only
    location ~ ^/oracle/(health|rounds|rounds/latest|auditpath)$ {
        limit_req zone=zennode burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8085/$1$is_args$args;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    location /oracle/ { return 404; }

    location ~ ^/(stats|assets|cgp-history)\.json$ {
        add_header Cache-Control "no-cache";
    }

    location /snapshots/ {
        autoindex on;
        add_header Cache-Control "no-cache" always;
    }

    # ZP Wallet (static, built by setup-site.sh). Keys never reach the server; strict headers
    # stop other sites framing it and limit where its scripts may connect.
    location = /wallet { return 301 /wallet/; }
    location /wallet/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
